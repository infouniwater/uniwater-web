<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t-monitor">
  <title id="t-monitor">Monitor / readout display</title>
  <!-- screen frame -->
  <rect x="6" y="9" width="36" height="24" rx="2" />
  <!-- stand neck -->
  <path d="M24 33 L24 39" />
