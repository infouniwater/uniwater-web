<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" width="1800" height="1050">
  <defs>
    <pattern id="grid-bg" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#05455F" stroke-width="0.3" opacity="0.04"/>
    </pattern>
    <pattern id="media-sand" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="2" cy="2" r="0.8" fill="#7396A3" opacity="0.4"/>
      <circle cx="6" cy="6" r="0.7" fill="#7396A3" opacity="0.35"/>
      <circle cx="4" cy="5" r="0.6" fill="#7396A3" opacity="0.3"/>
    </pattern>
    <pattern id="media-iron" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="2" cy="2" r="1.0" fill="#05455F" opacity="0.55"/>
      <circle cx="4.5" cy="4.5" r="0.9" fill="#05455F" opacity="0.45"/>
    </pattern>
    <pattern id="media-carbon" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect x="1" y="1" width="1.8" height="1.8" fill="#05455F" opacity="0.55"/>
      <rect x="3.5" y="3.5" width="1.6" height="1.6" fill="#05455F" opacity="0.45"/>
    </pattern>
    <pattern id="media-resin" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="3" cy="3" r="1.6" fill="#1B9BB4" opacity="0.45"/>
      <circle cx="6" cy="6" r="1.4" fill="#1B9BB4" opacity="0.35"/>
    </pattern>
    <pattern id="media-sba" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="3" cy="3" r="1.6" fill="#87D0CD" opacity="0.6"/>
      <circle cx="6" cy="6" r="1.4" fill="#87D0CD" opacity="0.5"/>
    </pattern>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B9BB4"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#87D0CD"/>
    </marker>
    <style>
      .bg          { fill: #FAF8F3; }
      .grid        { fill: url(#grid-bg); }
      .wordmark    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 22px; fill: #05455F; font-weight: 700; letter-spacing: 0.01em; }
      .wordmark-sub{ font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 11px; fill: #7396A3; font-weight: 400; letter-spacing: 0.08em; }
      .meta        { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.55; letter-spacing: 0.20em; text-transform: uppercase; }

      .eyebrow     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #1B9BB4; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
      .h1          { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 30px; fill: #05455F; font-weight: 600; letter-spacing: -0.005em; }
      .subhead     { font-family: "Bodoni Moda", "Signika", serif; font-style: italic; font-size: 14px; fill: #05455F; opacity: 0.7; }
      .h-section   { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 18px; fill: #05455F; font-weight: 600; }

      .vessel-stroke { stroke: #05455F; stroke-width: 1.8; fill: #FFFFFF; }
      .vessel-fill   { fill: #F2EEE6; }
      .vessel-cap    { stroke: #05455F; stroke-width: 1.8; fill: #FFFFFF; }
      .pipe          { stroke: #05455F; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .pipe-drain    { stroke: #7396A3; stroke-width: 2.0; fill: none; stroke-linecap: round; stroke-dasharray: 4 3; }
      .arch-line     { stroke: #05455F; stroke-width: 1.0; fill: none; }
      .hair          { stroke: #E5E1DA; stroke-width: 0.6; fill: none; }
      .accent        { stroke: #1B9BB4; stroke-width: 2.5; fill: none; }

      .label-stem    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #1B9BB4; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
      .label-head    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 13px; fill: #05455F; font-weight: 600; }
      .label-body    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 11px; fill: #05455F; opacity: 0.75; }
      .label-leader  { stroke: #1B9BB4; stroke-width: 1.0; fill: none; }

      .stage-num     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #1B9BB4; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; }
      .stage-name    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 14px; fill: #05455F; font-weight: 600; }
      .stage-detail  { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 11px; fill: #05455F; opacity: 0.75; }

      .footer        { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.55; }
      .footer-it     { font-family: "Bodoni Moda", "Signika", serif; font-style: italic; font-size: 11px; fill: #05455F; opacity: 0.75; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1050"/>
  <rect class="grid" width="1800" height="1050"/>
  <text class="wordmark" x="50" y="70">UNIWATER</text>
  <text class="wordmark-sub" x="210" y="70">SOLUTIONS</text>
  <text class="meta" x="1750" y="70" text-anchor="end">SVG-006 · landscape</text>
  <line class="hair" x1="50" y1="90" x2="1750" y2="90"/>
  <text class="eyebrow" x="50" y="130">Product cutaway</text>
  <text class="h1" x="50" y="160">Commercial RO</text>
  <text class="subhead" x="50" y="182">Where kitchen and centralised purifiers stop, commercial RO begins.</text>
  <rect x="50.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="50.0" y1="318" x2="50.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="62.0" y="328">Stage 01</text>
  <text class="label-head" x="62.0" y="346">Multi-media filter</text>
  <text class="label-body" x="62.0" y="364">PP sediment</text>
  <text class="label-body" x="62.0" y="378">20–50 micron</text>
  <path d="M 274.0 365.0 L 342.0 365.0" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="346.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="346.0" y1="318" x2="346.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="358.0" y="328">Stage 02</text>
  <text class="label-head" x="358.0" y="346">Activated carbon</text>
  <text class="label-body" x="358.0" y="364">IV 900 grade</text>
  <text class="label-body" x="358.0" y="378">Chlorine removal</text>
  <path d="M 570.0 365.0 L 638.0 365.0" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="642.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="642.0" y1="318" x2="642.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="654.0" y="328">Stage 03</text>
  <text class="label-head" x="654.0" y="346">Antiscalant dosing</text>
  <text class="label-body" x="654.0" y="364">Protects membrane</text>
  <text class="label-body" x="654.0" y="378">From scaling</text>
  <path d="M 866.0 365.0 L 934.0 365.0" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="938.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="938.0" y1="318" x2="938.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="950.0" y="328">Stage 04</text>
  <text class="label-head" x="950.0" y="346">High-pressure pump</text>
  <text class="label-body" x="950.0" y="364">8–15 bar</text>
  <text class="label-body" x="950.0" y="378">Membrane feed</text>
  <path d="M 1162.0 365.0 L 1230.0 365.0" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="1234.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="1234.0" y1="318" x2="1234.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="1246.0" y="328">Stage 05</text>
  <text class="label-head" x="1246.0" y="346">TFC RO array</text>
  <text class="label-body" x="1246.0" y="364">≥97% salt rejection</text>
  <text class="label-body" x="1246.0" y="378">35–75% recovery</text>
  <path d="M 1458.0 365.0 L 1526.0 365.0" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="1530.0" y="310" width="220" height="110" rx="3" fill="#FFFFFF" stroke="#05455F" stroke-width="1.4"/>
  <line x1="1530.0" y1="318" x2="1530.0" y2="412" stroke="#1B9BB4" stroke-width="3"/>
  <text class="label-stem" x="1542.0" y="328">Stage 06</text>
  <text class="label-head" x="1542.0" y="346">UV steriliser</text>
  <text class="label-body" x="1542.0" y="364">254 nm, ≥16 mJ/cm²</text>
  <text class="label-body" x="1542.0" y="378">Post-treatment</text>
  <path d="M 160.0 460 L 160.0 424" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="label-stem" x="160.0" y="476" text-anchor="middle">Feed water in</text>
  <path d="M 1640.0 306 L 1640.0 270" stroke="#05455F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="label-stem" x="1640.0" y="262" text-anchor="middle">Permeate to storage</text>
  <path d="M 1344.0 420 L 1344.0 570" class="pipe-drain"/>
  <path d="M 1339.0 565 L 1344.0 575 L 1349.0 565" fill="none" stroke="#7396A3" stroke-width="1.5"/>
  <text class="label-stem" x="1344.0" y="592" text-anchor="middle">Reject (25–65%)</text>
  <text class="label-body" x="1344.0" y="608" text-anchor="middle">→ drain or recovery</text>
  <rect x="32" y="290" width="1736.0" height="154" rx="4" fill="none" stroke="#7396A3" stroke-width="0.8" stroke-dasharray="6 3"/>
  <text class="label-stem" x="32" y="220">SS304 skid · 25–2,000 LPH range</text>
  <text class="label-stem" x="50.0" y="664">Recovery</text>
  <text class="label-head" x="50.0" y="686">35–75%</text>
  <text class="label-stem" x="390.0" y="664">Inlet TDS</text>
  <text class="label-head" x="390.0" y="686">up to 8,000 ppm</text>
  <text class="label-stem" x="730.0" y="664">Salt rejection</text>
  <text class="label-head" x="730.0" y="686">≥97%</text>
  <text class="label-stem" x="1070.0" y="664">Control</text>
  <text class="label-head" x="1070.0" y="686">PLC at 500+ LPH</text>
  <text class="label-stem" x="1410.0" y="664">Power</text>
  <text class="label-head" x="1410.0" y="686">220V or 3-phase</text>
  <line class="hair" x1="50" y1="702" x2="1750" y2="702"/>
  <line class="hair" x1="50" y1="992" x2="1750" y2="992"/>
  <text class="footer-it" x="50" y="1010">A site survey before a proposal. A proposal before a quote.</text>
  <text class="footer" x="1750" y="1010" text-anchor="end">SVG-006 · commercial-ro-landscape · uniwater.co.in</text>
</svg>