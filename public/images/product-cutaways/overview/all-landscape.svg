  <defs><clipPath id="combo-twin-clip-3-1-landscape"><path d="M 1588.4364 431.29999999999995 L 1588.4364 778.556 A 66.144 66.144 0 0 0 1720.7244 778.556 L 1720.7244 431.29999999999995 Z"/></clipPath></defs>
  <rect x="1588.4364" y="522.2479999999999" width="132.288" height="260.4420000000001" fill="url(#media-sba)" clip-path="url(#combo-twin-clip-3-1-landscape)"/>
