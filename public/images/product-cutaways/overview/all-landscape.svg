  <rect x="1347.5" y="230.0" width="402.5" height="740.0" rx="3" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="0.8"/>
  <line x1="1347.5" y1="230.0" x2="1407.5" y2="230.0" stroke="#1B9BB4" stroke-width="2.5"/>
