  <defs><clipPath id="combo-twin-clip-3-0-landscape"><path d="M 1376.7756 431.29999999999995 L 1376.7756 778.556 A 66.144 66.144 0 0 0 1509.0636 778.556 L 1509.0636 431.29999999999995 Z"/></clipPath></defs>
  <rect x="1376.7756" y="522.2479999999999" width="132.288" height="260.4420000000001" fill="url(#media-resin)" clip-path="url(#combo-twin-clip-3-0-landscape)"/>
