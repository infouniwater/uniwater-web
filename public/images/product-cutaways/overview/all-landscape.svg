  <defs><clipPath id="combo-clip-0-landscape"><path d="M 159.34799999999998 357.7 L 159.34799999999998 806.3979999999999 A 91.90200000000002 91.90200000000002 0 0 0 343.15200000000004 806.3979999999999 L 343.15200000000004 357.7 Z"/></clipPath></defs>
  <rect x="159.34799999999998" y="465.82" width="183.80400000000003" height="351.39000000000004" fill="url(#media-iron)" clip-path="url(#combo-clip-0-landscape)"/>
  <rect x="482.5" y="230.0" width="402.5" height="740.0" rx="3" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="0.8"/>
  <line x1="482.5" y1="230.0" x2="542.5" y2="230.0" stroke="#1B9BB4" stroke-width="2.5"/>
  <text class="label-stem" x="500.5" y="254.0">02 · Whole house</text>
  <text class="h-section" x="500.5" y="276.0">HomeSoft</text>
  <text class="label-body" x="500.5" y="294.0">2K–6K LPH · FRP vessel</text>
  <rect x="586.848" y="343.7" width="193.80400000000003" height="18" rx="2" class="vessel-cap"/>
  <path d="M 591.848 357.7 L 591.848 806.3979999999999 A 91.90200000000002 91.90200000000002 0 0 0 775.652 806.3979999999999 L 775.652 357.7 Z" class="vessel-stroke" fill="#F2EEE6"/>
  <defs><clipPath id="combo-clip-1-landscape"><path d="M 591.848 357.7 L 591.848 806.3979999999999 A 91.90200000000002 91.90200000000002 0 0 0 775.652 806.3979999999999 L 775.652 357.7 Z"/></clipPath></defs>
  <rect x="591.848" y="465.82" width="183.80400000000003" height="351.39000000000004" fill="url(#media-resin)" clip-path="url(#combo-clip-1-landscape)"/>
  <rect x="915.0" y="230.0" width="402.5" height="740.0" rx="3" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="0.8"/>
  <line x1="915.0" y1="230.0" x2="975.0" y2="230.0" stroke="#1B9BB4" stroke-width="2.5"/>
