<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect x="0" y="0" width="1920" height="1080" fill="#05455F" />
  <style>
    .navy-stroke { stroke: #D5EEF1; stroke-width: 2; fill: none; }
    .navy-stroke-thin { stroke: #D5EEF1; stroke-width: 1.5; fill: none; }
    .navy-fill { fill: #D5EEF1; }
    .ink { fill: #FFFFFF; }
    .grey { fill: #87D0CD; }
    .h-num { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 80px; fill: #D5EEF1; }
    .h-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 32px; fill: #FFFFFF; }
    .h-body { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #87D0CD; }
    .h-tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 18px; fill: #87D0CD; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>

  <!-- Top horizontal accent line -->
  <line x1="120" y1="180" x2="1800" y2="180" class="navy-stroke" stroke-width="1" />

  <!-- Three columns at top -->

  <!-- COL 1: CHEMISTRY -->
  <g transform="translate(180, 280)">
    <!-- Hex / molecule icon -->
    <g transform="translate(0, 0)">
      <polygon points="60,0 110,30 110,90 60,120 10,90 10,30" class="navy-stroke" />
      <circle cx="60" cy="60" r="6" class="navy-fill" />
      <circle cx="35" cy="45" r="4" class="navy-fill" />
      <circle cx="85" cy="45" r="4" class="navy-fill" />
      <circle cx="35" cy="75" r="4" class="navy-fill" />
      <circle cx="85" cy="75" r="4" class="navy-fill" />
      <line x1="60" y1="60" x2="35" y2="45" class="navy-stroke-thin" />
      <line x1="60" y1="60" x2="85" y2="45" class="navy-stroke-thin" />
      <line x1="60" y1="60" x2="35" y2="75" class="navy-stroke-thin" />
      <line x1="60" y1="60" x2="85" y2="75" class="navy-stroke-thin" />
    </g>
    <text x="0" y="180" class="h-tag">Reason 01</text>
    <text x="0" y="225" class="h-label">It's chemistry.</text>
  </g>

  <!-- COL 2: PEOPLE -->
  <g transform="translate(720, 280)">
    <!-- Person silhouettes -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="18" class="navy-stroke" />
      <path d="M 5 110 Q 5 65 30 65 Q 55 65 55 110 Z" class="navy-stroke" />
      <circle cx="80" cy="30" r="18" class="navy-stroke" />
      <path d="M 55 110 Q 55 65 80 65 Q 105 65 105 110 Z" class="navy-stroke" />
    </g>
    <text x="0" y="180" class="h-tag">Reason 02</text>
    <text x="0" y="225" class="h-label">It's the people who use it.</text>
  </g>

  <!-- COL 3: THINGS -->
  <g transform="translate(1260, 280)">
    <!-- House outline -->
    <g transform="translate(0, 0)">
      <polyline points="10,55 60,15 110,55" class="navy-stroke" />
      <rect x="20" y="55" width="80" height="65" class="navy-stroke" />
      <line x1="40" y1="55" x2="40" y2="120" class="navy-stroke-thin" />
      <line x1="80" y1="55" x2="80" y2="120" class="navy-stroke-thin" />
      <line x1="20" y1="85" x2="100" y2="85" class="navy-stroke-thin" />
      <circle cx="60" cy="100" r="5" class="navy-fill" />
    </g>
    <text x="0" y="180" class="h-tag">Reason 03</text>
    <text x="0" y="225" class="h-label">It's everything water touches.</text>
  </g>

  <!-- Connecting horizontal flow line -->
  <line x1="280" y1="340" x2="720" y2="340" class="navy-stroke-thin" stroke-dasharray="2 6" />
  <line x1="820" y1="340" x2="1260" y2="340" class="navy-stroke-thin" stroke-dasharray="2 6" />

  <!-- Bottom accent line -->
  <line x1="120" y1="600" x2="1800" y2="600" class="navy-stroke" stroke-width="1" />

  <!-- Pull quote at bottom -->
  <g transform="translate(120, 720)">
    <text class="h-tag">In summary</text>
    <text y="80" font-family="'Helvetica Neue', Georgia, serif" font-style="italic" font-weight="300" font-size="56" fill="#D5EEF1">Three forces. One result.</text>
    <text y="140" font-family="'Helvetica Neue', Georgia, serif" font-style="italic" font-weight="300" font-size="56" fill="#D5EEF1">A house that ages faster than it should.</text>
  </g>
</svg>
