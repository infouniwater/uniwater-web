<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#05455F" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="tile" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#E5E1DA"/>
      <path d="M0 0 L20 0 M0 10 L20 10 M0 0 L0 10 M10 0 L10 10" stroke="#05455F" stroke-width="0.4" opacity="0.3" fill="none"/>
    </pattern>
    <pattern id="utility-tile" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#E5E1DA"/>
      <path d="M0 0 L60 0 M0 60 L60 60 M0 0 L0 60 M60 0 L60 60" stroke="#05455F" stroke-width="0.3" opacity="0.25" fill="none"/>
    </pattern>
    <pattern id="terrace" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#E5E1DA"/>
      <path d="M0 0 L40 0 M0 40 L40 40 M0 0 L0 40 M40 0 L40 40" stroke="#05455F" stroke-width="0.3" opacity="0.3" fill="none"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="#05455F" stroke-width="0.2" opacity="0.15" fill="none"/>
    </pattern>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#EAE7DC"/>
      <path d="M3 12 L5 6 M7 13 L8 7 M11 12 L12 6" stroke="#05455F" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round"/>
    </pattern>
    <style>
      .wall-fill   { fill: url(#hatch); }
      .tile-fill   { fill: url(#tile); }
      .floor-fill  { fill: url(#utility-tile); }
      .terrace-fill{ fill: url(#terrace); }
      .grass-fill  { fill: url(#grass); }
      .void-fill   { fill: #FAF8F3; }
      .outline     { fill: none; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .secondary   { fill: none; stroke: #05455F; stroke-width: 0.75; stroke-linejoin: round; stroke-linecap: round; }
      .detail      { fill: none; stroke: #05455F; stroke-width: 0.5; }
      .vessel      { fill: #FFFFFF; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .vessel-tint { fill: #F2EEE6; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .pipe        { fill: none; stroke: #05455F; stroke-width: 1.2; stroke-linecap: round; }
      .pipe-water  { fill: none; stroke: #1B9BB4; stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }
      .dim-line    { fill: none; stroke: #1B9BB4; stroke-width: 0.6; }
      .leader      { fill: none; stroke: #05455F; stroke-width: 0.5; opacity: 0.7; }
      .dim-text    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #1B9BB4; font-weight: 500; }
      .callout     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9.5px; fill: #05455F; font-weight: 500; }
      .title       { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 14px; fill: #05455F; font-weight: 600; letter-spacing: 0.04em; }
      .subtitle    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #05455F; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; }
      .axis-label  { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 8px; fill: #05455F; opacity: 0.4; letter-spacing: 0.1em; }
      .axis-label-strong { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.65; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FAF8F3"/>
  <text class="subtitle" x="50" y="50">BATHROOM INSTALL · 1 of 7</text>
  <text class="title" x="50" y="74">1. False-ceiling install</text>
  <line class="secondary" x1="50" y1="86" x2="200" y2="86" opacity="0.4"/>
  <!-- Structural slab -->
  <rect class="wall-fill" x="100" y="120" width="700" height="40"/>
  <line class="outline" x1="100" y1="120" x2="800" y2="120"/>
  <line class="outline" x1="100" y1="160" x2="800" y2="160"/>

  <!-- Service void -->
  <rect class="void-fill" x="100" y="160" width="700" height="120"/>

  <!-- False ceiling -->
  <line class="outline" x1="100" y1="280" x2="540" y2="280"/>
  <line class="outline" x1="540" y1="280" x2="640" y2="280" stroke-dasharray="4 3" opacity="0.5"/>
  <line class="outline" x1="640" y1="280" x2="800" y2="280"/>
  <!-- Access panel hinged open -->
  <g transform="rotate(60 540 280)">
    <rect class="vessel-tint" x="540" y="276" width="100" height="8"/>
  </g>

  <!-- Vessels mounted in void -->
  <rect class="vessel" x="240" y="170" width="60" height="100" rx="4"/>
  <ellipse cx="270.0" cy="170" rx="30.0" ry="5" class="vessel"/>
  <ellipse cx="270.0" cy="270" rx="30.0" ry="5" class="vessel"/>
  <rect class="vessel" x="360" y="170" width="60" height="100" rx="4"/>
  <ellipse cx="390.0" cy="170" rx="30.0" ry="5" class="vessel"/>
  <ellipse cx="390.0" cy="270" rx="30.0" ry="5" class="vessel"/>
  <!-- Pipework -->
  <path class="pipe" d="M270 170 L270 145 L390 145 L390 170"/>
  <path class="pipe" d="M180 145 L270 145"/>
  <path class="pipe" d="M390 145 L480 145 L480 170 L480 285"/>

  <!-- Threaded rods -->
  <line class="detail" x1="260" y1="160" x2="260" y2="120" stroke-dasharray="2 1"/>
  <line class="detail" x1="280" y1="160" x2="280" y2="120" stroke-dasharray="2 1"/>
  <line class="detail" x1="380" y1="160" x2="380" y2="120" stroke-dasharray="2 1"/>
  <line class="detail" x1="400" y1="160" x2="400" y2="120" stroke-dasharray="2 1"/>
  <path class="secondary" d="M255 165 L255 160 L285 160 L285 165"/>
  <path class="secondary" d="M375 165 L375 160 L405 160 L405 165"/>

  <!-- Tile wall + floor -->
  <rect class="tile-fill" x="760" y="280" width="40" height="280"/>
  <line class="outline" x1="760" y1="280" x2="760" y2="560"/>
  <rect class="tile-fill" x="100" y="560" width="700" height="20"/>
  <line class="outline" x1="100" y1="560" x2="800" y2="560"/>

  <!-- Shower fixture -->
  <path class="pipe" d="M760 380 L730 380 L730 395"/>
  <circle class="vessel" cx="730" cy="400" r="6"/>

  <g class="dim">
    <line class="dim-line" x1="80" y1="160" x2="80" y2="280"/>
    <line class="dim-line" x1="76" y1="160" x2="84" y2="160"/>
    <line class="dim-line" x1="76" y1="280" x2="84" y2="280"/>
    <text class="dim-text" x="74" y="223.0" text-anchor="end">120 mm</text>
  </g>
  <g class="dim">
    <line class="dim-line" x1="100" y1="600" x2="800" y2="600"/>
    <line class="dim-line" x1="100" y1="596" x2="100" y2="604"/>
    <line class="dim-line" x1="800" y1="596" x2="800" y2="604"/>
    <text class="dim-text" x="450.0" y="614" text-anchor="middle">Bathroom width — install void above</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M270 220 L204 222"/>
    <circle cx="270" cy="220" r="1.5" fill="#05455F"/>
    <text class="callout" x="200" y="225" text-anchor="end">SS twin softener</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M480 310 L516 477"/>
    <circle cx="480" cy="310" r="1.5" fill="#05455F"/>
    <text class="callout" x="520" y="480" text-anchor="start">Outlet to bathroom</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M610 320 L696 412"/>
    <circle cx="610" cy="320" r="1.5" fill="#05455F"/>
    <text class="callout" x="700" y="415" text-anchor="start">Access panel — opens for service</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M280 130 L224 107"/>
    <circle cx="280" cy="130" r="1.5" fill="#05455F"/>
    <text class="callout" x="220" y="110" text-anchor="end">Threaded rod mount to slab</text>
  </g>
  <text class="axis-label" x="500" y="650" text-anchor="middle">SECTION A–A · NTS</text>
</svg>