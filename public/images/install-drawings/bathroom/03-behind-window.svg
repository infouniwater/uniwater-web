<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#05455F" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="tile" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#E5E1DA"/>
      <path d="M0 0 L20 0 M0 10 L20 10 M0 0 L0 10 M10 0 L10 10" stroke="#05455F" stroke-width="0.4" opacity="0.3" fill="none"/>
    </pattern>
    <pattern id="utility-tile" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#E5E1DA"/>
      <path d="M0 0 L60 0 M0 60 L60 60 M0 0 L0 60 M60 0 L60 60" stroke="#05455F" stroke-width="0.3" opacity="0.25" fill="none"/>
    </pattern>
    <pattern id="terrace" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#E5E1DA"/>
      <path d="M0 0 L40 0 M0 40 L40 40 M0 0 L0 40 M40 0 L40 40" stroke="#05455F" stroke-width="0.3" opacity="0.3" fill="none"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="#05455F" stroke-width="0.2" opacity="0.15" fill="none"/>
    </pattern>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#EAE7DC"/>
      <path d="M3 12 L5 6 M7 13 L8 7 M11 12 L12 6" stroke="#05455F" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round"/>
    </pattern>
    <style>
      .wall-fill   { fill: url(#hatch); }
      .tile-fill   { fill: url(#tile); }
      .floor-fill  { fill: url(#utility-tile); }
      .terrace-fill{ fill: url(#terrace); }
      .grass-fill  { fill: url(#grass); }
      .void-fill   { fill: #FAF8F3; }
      .outline     { fill: none; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .secondary   { fill: none; stroke: #05455F; stroke-width: 0.75; stroke-linejoin: round; stroke-linecap: round; }
      .detail      { fill: none; stroke: #05455F; stroke-width: 0.5; }
      .vessel      { fill: #FFFFFF; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .vessel-tint { fill: #F2EEE6; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .pipe        { fill: none; stroke: #05455F; stroke-width: 1.2; stroke-linecap: round; }
      .pipe-water  { fill: none; stroke: #1B9BB4; stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }
      .dim-line    { fill: none; stroke: #1B9BB4; stroke-width: 0.6; }
      .leader      { fill: none; stroke: #05455F; stroke-width: 0.5; opacity: 0.7; }
      .dim-text    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #1B9BB4; font-weight: 500; }
      .callout     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9.5px; fill: #05455F; font-weight: 500; }
      .title       { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 14px; fill: #05455F; font-weight: 600; letter-spacing: 0.04em; }
      .subtitle    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #05455F; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; }
      .axis-label  { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 8px; fill: #05455F; opacity: 0.4; letter-spacing: 0.1em; }
      .axis-label-strong { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.65; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FAF8F3"/>
  <text class="subtitle" x="50" y="50">BATHROOM INSTALL · 3 of 7</text>
  <text class="title" x="50" y="74">3. Behind bathroom window (in service cavity)</text>
  <line class="secondary" x1="50" y1="86" x2="200" y2="86" opacity="0.4"/>
  <!-- Bathroom wall (inner) -->
  <rect class="tile-fill" x="80" y="110" width="60" height="500"/>
  <line class="outline" x1="80" y1="110" x2="80" y2="610"/>
  <line class="outline" x1="140" y1="110" x2="140" y2="220"/>
  <line class="outline" x1="140" y1="380" x2="140" y2="610"/>

  <!-- Window opening on inner wall -->
  <rect class="vessel" x="140" y="220" width="6" height="160"/>
  <!-- Window glass -->
  <line class="detail" x1="143" y1="220" x2="143" y2="380"/>
  <!-- Window operable (top hung casement, half open) -->
  <line class="secondary" x1="146" y1="220" x2="180" y2="200" opacity="0.6"/>
  <line class="secondary" x1="146" y1="380" x2="146" y2="380"/>

  <!-- Service cavity (between inner wall and outer wall) -->
  <rect class="void-fill" x="140" y="110" width="320" height="500"/>

  <!-- Outer building wall -->
  <rect class="wall-fill" x="460" y="110" width="60" height="500"/>
  <line class="outline" x1="460" y1="110" x2="460" y2="610"/>
  <line class="outline" x1="520" y1="110" x2="520" y2="610"/>

  <!-- Outside (exterior) -->
  <rect fill="#FAF8F3" x="520" y="110" width="280" height="500"/>
  <text class="axis-label" x="660" y="350" text-anchor="middle" opacity="0.4">EXTERIOR</text>

  <!-- Vessels inside the cavity, accessible via window -->
  <rect class="vessel" x="220" y="240" width="70" height="280" rx="4"/>
  <ellipse cx="255.0" cy="240" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="255.0" cy="520" rx="35.0" ry="5" class="vessel"/>
  <rect class="vessel" x="310" y="240" width="70" height="280" rx="4"/>
  <ellipse cx="345.0" cy="240" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="345.0" cy="520" rx="35.0" ry="5" class="vessel"/>

  <!-- Plumbing into the bathroom (left, through inner wall) -->
  <path class="pipe" d="M255 240 L255 210 L345 210 L345 240"/>
  <path class="pipe" d="M80 210 L255 210"/>
  <path class="pipe" d="M345 240 L420 240"/>
  <path class="pipe" d="M345 520 L345 555"/>

  <!-- Drainage exiting to outer wall -->
  <path class="pipe" d="M420 240 L420 555 L380 555"/>

  <!-- Floor of bathroom + floor of cavity -->
  <rect class="tile-fill" x="80" y="560" width="60" height="50"/>
  <rect class="void-fill" x="140" y="560" width="320" height="50"/>
  <line class="outline" x1="80" y1="560" x2="460" y2="560"/>

  <!-- Service access indication: window open, hand reaches in -->
  <text class="axis-label-strong" x="290" y="200" text-anchor="middle">SERVICE ACCESS VIA WINDOW</text>
  <path class="leader" d="M180 200 L210 215" stroke-dasharray="2 2"/>


  <g class="dim">
    <line class="dim-line" x1="140" y1="100" x2="460" y2="100"/>
    <line class="dim-line" x1="140" y1="96" x2="140" y2="104"/>
    <line class="dim-line" x1="460" y1="96" x2="460" y2="104"/>
    <text class="dim-text" x="300.0" y="114" text-anchor="middle">Service cavity — 320 mm clear</text>
  </g>
  <g class="dim">
    <line class="dim-line" x1="60" y1="220" x2="60" y2="380"/>
    <line class="dim-line" x1="56" y1="220" x2="64" y2="220"/>
    <line class="dim-line" x1="56" y1="380" x2="64" y2="380"/>
    <text class="dim-text" x="54" y="303.0" text-anchor="end">Window opening</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M255 360 L204 357"/>
    <circle cx="255" cy="360" r="1.5" fill="#05455F"/>
    <text class="callout" x="200" y="360" text-anchor="end">SS twin in cavity</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M140 300 L204 527"/>
    <circle cx="140" cy="300" r="1.5" fill="#05455F"/>
    <text class="callout" x="200" y="530" text-anchor="end">Inner wall (bathroom side)</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M520 350 L804 527"/>
    <circle cx="520" cy="350" r="1.5" fill="#05455F"/>
    <text class="callout" x="800" y="530" text-anchor="end">External wall (building skin)</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M420 550 L476 577"/>
    <circle cx="420" cy="550" r="1.5" fill="#05455F"/>
    <text class="callout" x="480" y="580" text-anchor="start">Drain exits through external wall</text>
  </g>
  <text class="axis-label" x="500" y="650" text-anchor="middle">SECTION D–D · NTS</text>
</svg>