<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#05455F" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="tile" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#E5E1DA"/>
      <path d="M0 0 L20 0 M0 10 L20 10 M0 0 L0 10 M10 0 L10 10" stroke="#05455F" stroke-width="0.4" opacity="0.3" fill="none"/>
    </pattern>
    <pattern id="utility-tile" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#E5E1DA"/>
      <path d="M0 0 L60 0 M0 60 L60 60 M0 0 L0 60 M60 0 L60 60" stroke="#05455F" stroke-width="0.3" opacity="0.25" fill="none"/>
    </pattern>
    <pattern id="terrace" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#E5E1DA"/>
      <path d="M0 0 L40 0 M0 40 L40 40 M0 0 L0 40 M40 0 L40 40" stroke="#05455F" stroke-width="0.3" opacity="0.3" fill="none"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="#05455F" stroke-width="0.2" opacity="0.15" fill="none"/>
    </pattern>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#EAE7DC"/>
      <path d="M3 12 L5 6 M7 13 L8 7 M11 12 L12 6" stroke="#05455F" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round"/>
    </pattern>
    <style>
      .wall-fill   { fill: url(#hatch); }
      .tile-fill   { fill: url(#tile); }
      .floor-fill  { fill: url(#utility-tile); }
      .terrace-fill{ fill: url(#terrace); }
      .grass-fill  { fill: url(#grass); }
      .void-fill   { fill: #FAF8F3; }
      .outline     { fill: none; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .secondary   { fill: none; stroke: #05455F; stroke-width: 0.75; stroke-linejoin: round; stroke-linecap: round; }
      .detail      { fill: none; stroke: #05455F; stroke-width: 0.5; }
      .vessel      { fill: #FFFFFF; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .vessel-tint { fill: #F2EEE6; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .pipe        { fill: none; stroke: #05455F; stroke-width: 1.2; stroke-linecap: round; }
      .pipe-water  { fill: none; stroke: #1B9BB4; stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }
      .dim-line    { fill: none; stroke: #1B9BB4; stroke-width: 0.6; }
      .leader      { fill: none; stroke: #05455F; stroke-width: 0.5; opacity: 0.7; }
      .dim-text    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #1B9BB4; font-weight: 500; }
      .callout     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9.5px; fill: #05455F; font-weight: 500; }
      .title       { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 14px; fill: #05455F; font-weight: 600; letter-spacing: 0.04em; }
      .subtitle    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #05455F; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; }
      .axis-label  { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 8px; fill: #05455F; opacity: 0.4; letter-spacing: 0.1em; }
      .axis-label-strong { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.65; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FAF8F3"/>
  <text class="subtitle" x="50" y="50">WHOLE-HOUSE INSTALL · 4 of 5</text>
  <text class="title" x="50" y="74">4. Basement install (villa plant room)</text>
  <line class="secondary" x1="50" y1="86" x2="200" y2="86" opacity="0.4"/>
  <!-- Concrete slab above (ceiling of basement) -->
  <rect class="wall-fill" x="60" y="110" width="780" height="50"/>
  <line class="outline" x1="60" y1="110" x2="840" y2="110"/>
  <line class="outline" x1="60" y1="160" x2="840" y2="160"/>

  <!-- Walls on left + right (basement walls below grade) -->
  <rect class="wall-fill" x="60" y="160" width="50" height="450"/>
  <line class="outline" x1="60" y1="160" x2="60" y2="610"/>
  <line class="outline" x1="110" y1="160" x2="110" y2="610"/>

  <rect class="wall-fill" x="790" y="160" width="50" height="450"/>
  <line class="outline" x1="790" y1="160" x2="790" y2="610"/>
  <line class="outline" x1="840" y1="160" x2="840" y2="610"/>

  <!-- Floor (concrete) -->
  <rect class="wall-fill" x="60" y="560" width="780" height="50"/>
  <line class="outline" x1="60" y1="560" x2="840" y2="560"/>

  <!-- Basement room void -->
  <rect class="void-fill" x="110" y="160" width="680" height="400"/>

  <!-- Sump pit in floor (small) -->
  <rect class="wall-fill" x="650" y="490" width="100" height="70"/>
  <line class="outline" x1="650" y1="490" x2="750" y2="490"/>
  <line class="outline" x1="650" y1="490" x2="650" y2="560"/>
  <line class="outline" x1="750" y1="490" x2="750" y2="560"/>
  <text class="axis-label" x="700" y="535" text-anchor="middle" opacity="0.6">SUMP PIT</text>

  <!-- Inlet through ceiling (from building above) -->
  <path class="pipe" d="M170 110 L170 200"/>

  <!-- Iron filter (first stage — basement-fed installs often have iron) -->
  <rect class="vessel" x="140" y="200" width="70" height="280" rx="4"/>
  <ellipse cx="175.0" cy="200" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="175.0" cy="480" rx="35.0" ry="5" class="vessel"/>
  <text class="axis-label" x="175" y="345" text-anchor="middle" opacity="0.7">IRON FILTER</text>

  <!-- Softener twin -->
  <rect class="vessel" x="260" y="200" width="70" height="280" rx="4"/>
  <ellipse cx="295.0" cy="200" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="295.0" cy="480" rx="35.0" ry="5" class="vessel"/>
  <rect class="vessel" x="350" y="200" width="70" height="280" rx="4"/>
  <ellipse cx="385.0" cy="200" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="385.0" cy="480" rx="35.0" ry="5" class="vessel"/>
  <rect class="vessel-tint" x="280" y="180" width="40" height="20" rx="2"/>
  <rect class="vessel-tint" x="370" y="180" width="40" height="20" rx="2"/>

  <!-- Carbon filter (final polish) -->
  <rect class="vessel" x="440" y="200" width="70" height="280" rx="4"/>
  <ellipse cx="475.0" cy="200" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="475.0" cy="480" rx="35.0" ry="5" class="vessel"/>
  <text class="axis-label" x="475" y="345" text-anchor="middle" opacity="0.7">CARBON</text>

  <!-- Inter-vessel pipework -->
  <path class="pipe" d="M210 240 L260 240"/>
  <path class="pipe" d="M330 230 L350 230"/>
  <path class="pipe" d="M420 240 L440 240"/>

  <!-- Brine tank -->
  <rect class="vessel-tint" x="540" y="320" width="70" height="160" rx="4"/>
  <ellipse cx="575" cy="320" rx="35" ry="5" class="vessel-tint"/>
  <text class="axis-label" x="575" y="425" text-anchor="middle" opacity="0.7">BRINE</text>
  <path class="pipe" d="M540 360 L520 360 L520 270 L420 270"/>

  <!-- Outlet up to building -->
  <path class="pipe" d="M510 240 L700 240 L700 160"/>

  <!-- Drain to sump -->
  <path class="pipe" d="M620 480 L680 480 L680 490"/>

  <!-- Sump pump suggestion in pit -->
  <rect class="vessel-tint" x="680" y="510" width="40" height="40" rx="2"/>
  <line class="pipe" x1="700" y1="510" x2="700" y2="490"/>


  <g class="dim">
    <line class="dim-line" x1="140" y1="540" x2="510" y2="540"/>
    <line class="dim-line" x1="140" y1="536" x2="140" y2="544"/>
    <line class="dim-line" x1="510" y1="536" x2="510" y2="544"/>
    <text class="dim-text" x="325.0" y="554" text-anchor="middle">4-stage train — 370 mm</text>
  </g>
  <g class="dim">
    <line class="dim-line" x1="75" y1="110" x2="75" y2="560"/>
    <line class="dim-line" x1="71" y1="110" x2="79" y2="110"/>
    <line class="dim-line" x1="71" y1="560" x2="79" y2="560"/>
    <text class="dim-text" x="69" y="338.0" text-anchor="end">Basement clear height</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M175 200 L84 177"/>
    <circle cx="175" cy="200" r="1.5" fill="#05455F"/>
    <text class="callout" x="80" y="180" text-anchor="end">Inlet from building above</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M700 130 L756 127"/>
    <circle cx="700" cy="130" r="1.5" fill="#05455F"/>
    <text class="callout" x="760" y="130" text-anchor="start">Treated water rises to building</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M700 525 L776 577"/>
    <circle cx="700" cy="525" r="1.5" fill="#05455F"/>
    <text class="callout" x="780" y="580" text-anchor="start">Sump pump returns backwash</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M330 200 L476 167"/>
    <circle cx="330" cy="200" r="1.5" fill="#05455F"/>
    <text class="callout" x="480" y="170" text-anchor="start">Softener twin · auto-regen</text>
  </g>
  <text class="axis-label" x="500" y="650" text-anchor="middle">SECTION F–F · NTS</text>
</svg>