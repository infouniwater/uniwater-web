<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#05455F" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="tile" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#E5E1DA"/>
      <path d="M0 0 L20 0 M0 10 L20 10 M0 0 L0 10 M10 0 L10 10" stroke="#05455F" stroke-width="0.4" opacity="0.3" fill="none"/>
    </pattern>
    <pattern id="utility-tile" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#E5E1DA"/>
      <path d="M0 0 L60 0 M0 60 L60 60 M0 0 L0 60 M60 0 L60 60" stroke="#05455F" stroke-width="0.3" opacity="0.25" fill="none"/>
    </pattern>
    <pattern id="terrace" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#E5E1DA"/>
      <path d="M0 0 L40 0 M0 40 L40 40 M0 0 L0 40 M40 0 L40 40" stroke="#05455F" stroke-width="0.3" opacity="0.3" fill="none"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="#05455F" stroke-width="0.2" opacity="0.15" fill="none"/>
    </pattern>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#EAE7DC"/>
      <path d="M3 12 L5 6 M7 13 L8 7 M11 12 L12 6" stroke="#05455F" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round"/>
    </pattern>
    <style>
      .wall-fill   { fill: url(#hatch); }
      .tile-fill   { fill: url(#tile); }
      .floor-fill  { fill: url(#utility-tile); }
      .terrace-fill{ fill: url(#terrace); }
      .grass-fill  { fill: url(#grass); }
      .void-fill   { fill: #FAF8F3; }
      .outline     { fill: none; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .secondary   { fill: none; stroke: #05455F; stroke-width: 0.75; stroke-linejoin: round; stroke-linecap: round; }
      .detail      { fill: none; stroke: #05455F; stroke-width: 0.5; }
      .vessel      { fill: #FFFFFF; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .vessel-tint { fill: #F2EEE6; stroke: #05455F; stroke-width: 1.5; stroke-linejoin: round; }
      .pipe        { fill: none; stroke: #05455F; stroke-width: 1.2; stroke-linecap: round; }
      .pipe-water  { fill: none; stroke: #1B9BB4; stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }
      .dim-line    { fill: none; stroke: #1B9BB4; stroke-width: 0.6; }
      .leader      { fill: none; stroke: #05455F; stroke-width: 0.5; opacity: 0.7; }
      .dim-text    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #1B9BB4; font-weight: 500; }
      .callout     { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9.5px; fill: #05455F; font-weight: 500; }
      .title       { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 14px; fill: #05455F; font-weight: 600; letter-spacing: 0.04em; }
      .subtitle    { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 10px; fill: #05455F; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; }
      .axis-label  { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 8px; fill: #05455F; opacity: 0.4; letter-spacing: 0.1em; }
      .axis-label-strong { font-family: "Signika", "Inter", system-ui, sans-serif; font-size: 9px; fill: #05455F; opacity: 0.65; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FAF8F3"/>
  <text class="subtitle" x="50" y="50">WHOLE-HOUSE INSTALL · 5 of 5</text>
  <text class="title" x="50" y="74">5. Garden install (near borewell, weather hood)</text>
  <line class="secondary" x1="50" y1="86" x2="200" y2="86" opacity="0.4"/>
  <!-- Ground (grass) -->
  <rect class="grass-fill" x="60" y="450" width="780" height="160"/>
  <line class="outline" x1="60" y1="450" x2="840" y2="450"/>

  <!-- Concrete pad under install (so vessels don't sit on grass) -->
  <rect class="wall-fill" x="290" y="430" width="320" height="20"/>
  <line class="outline" x1="290" y1="430" x2="610" y2="430"/>

  <!-- Borewell head (left, in ground) -->
  <rect class="vessel-tint" x="110" y="400" width="60" height="50" rx="2"/>
  <rect class="wall-fill" x="125" y="380" width="30" height="20"/>
  <line class="outline" x1="125" y1="380" x2="155" y2="380"/>
  <line class="outline" x1="125" y1="380" x2="125" y2="400"/>
  <line class="outline" x1="155" y1="380" x2="155" y2="400"/>
  <!-- Borewell pipe down into earth (dashed) -->
  <line class="detail" x1="140" y1="450" x2="140" y2="600" stroke-dasharray="3 3" opacity="0.6"/>
  <text class="axis-label" x="140" y="630" text-anchor="middle" opacity="0.6">BOREWELL</text>

  <!-- Weather hood / pergola over install -->
  <path class="outline" d="M280 250 L620 250 L600 280 L300 280 Z" fill="#F2EEE6"/>
  <line class="outline" x1="280" y1="250" x2="300" y2="280"/>
  <line class="outline" x1="620" y1="250" x2="600" y2="280"/>
  <!-- Hood support posts -->
  <line class="outline" x1="310" y1="280" x2="310" y2="430"/>
  <line class="outline" x1="590" y1="280" x2="590" y2="430"/>
  <!-- Slight angled roof support brackets -->
  <line class="secondary" x1="310" y1="290" x2="320" y2="280"/>
  <line class="secondary" x1="590" y1="290" x2="580" y2="280"/>

  <!-- Iron filter (heavy duty — typical for borewell) -->
  <rect class="vessel" x="330" y="290" width="70" height="140" rx="4"/>
  <ellipse cx="365.0" cy="290" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="365.0" cy="430" rx="35.0" ry="5" class="vessel"/>
  <text class="axis-label" x="365" y="365" text-anchor="middle" opacity="0.7">IRON</text>

  <!-- Softener -->
  <rect class="vessel" x="420" y="290" width="70" height="140" rx="4"/>
  <ellipse cx="455.0" cy="290" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="455.0" cy="430" rx="35.0" ry="5" class="vessel"/>
  <text class="axis-label" x="455" y="365" text-anchor="middle" opacity="0.7">SOFTENER</text>

  <!-- Carbon -->
  <rect class="vessel" x="510" y="290" width="70" height="140" rx="4"/>
  <ellipse cx="545.0" cy="290" rx="35.0" ry="5" class="vessel"/>
  <ellipse cx="545.0" cy="430" rx="35.0" ry="5" class="vessel"/>
  <text class="axis-label" x="545" y="365" text-anchor="middle" opacity="0.7">CARBON</text>

  <!-- Brine tank on pad -->
  <rect class="vessel-tint" x="610" y="370" width="50" height="60" rx="3"/>
  <ellipse cx="635" cy="370" rx="25" ry="3" class="vessel-tint"/>

  <!-- Pipework -->
  <path class="pipe-water" d="M170 425 L290 425 L290 380 L330 380"/>
  <path class="pipe" d="M400 380 L420 380"/>
  <path class="pipe" d="M490 380 L510 380"/>
  <path class="pipe" d="M610 400 L600 400 L600 360 L545 360"/>
  <!-- Outlet to house -->
  <path class="pipe" d="M580 425 L740 425 L740 380"/>

  <!-- House (right edge, hint) -->
  <rect class="wall-fill" x="740" y="280" width="100" height="170"/>
  <line class="outline" x1="740" y1="280" x2="840" y2="280"/>
  <line class="outline" x1="740" y1="280" x2="740" y2="450"/>
  <!-- Roof line of house -->
  <path class="outline" d="M730 280 L790 230 L850 280" fill="none"/>
  <text class="axis-label" x="790" y="350" text-anchor="middle" opacity="0.5">HOUSE</text>

  <!-- Sun indicator -->
  <circle class="secondary" cx="140" cy="200" r="18" opacity="0.4"/>
  <line class="detail" x1="140" y1="175" x2="140" y2="165" opacity="0.4"/>
  <line class="detail" x1="115" y1="200" x2="105" y2="200" opacity="0.4"/>
  <line class="detail" x1="165" y1="200" x2="175" y2="200" opacity="0.4"/>


  <g class="dim">
    <line class="dim-line" x1="280" y1="220" x2="620" y2="220"/>
    <line class="dim-line" x1="280" y1="216" x2="280" y2="224"/>
    <line class="dim-line" x1="620" y1="216" x2="620" y2="224"/>
    <text class="dim-text" x="450.0" y="216" text-anchor="middle">Hood span — 340 mm</text>
  </g>
  <g class="dim">
    <line class="dim-line" x1="280" y1="290" x2="280" y2="430"/>
    <line class="dim-line" x1="276" y1="290" x2="284" y2="290"/>
    <line class="dim-line" x1="276" y1="430" x2="284" y2="430"/>
    <text class="dim-text" x="274" y="363.0" text-anchor="end">Vessel 140 mm</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M140 420 L226 467"/>
    <circle cx="140" cy="420" r="1.5" fill="#05455F"/>
    <text class="callout" x="230" y="470" text-anchor="start">Borewell head — raw inlet</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M450 250 L596 207"/>
    <circle cx="450" cy="250" r="1.5" fill="#05455F"/>
    <text class="callout" x="600" y="210" text-anchor="start">Weather hood — sun + rain protection</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M635 415 L726 577"/>
    <circle cx="635" cy="415" r="1.5" fill="#05455F"/>
    <text class="callout" x="730" y="580" text-anchor="start">Brine tank — weather-rated</text>
  </g>
  <g class="callout-group">
    <path class="leader" d="M740 380 L796 227"/>
    <circle cx="740" cy="380" r="1.5" fill="#05455F"/>
    <text class="callout" x="800" y="230" text-anchor="start">Outlet to house plumbing</text>
  </g>
  <text class="axis-label" x="500" y="650" text-anchor="middle">ELEVATION · NTS</text>
</svg>