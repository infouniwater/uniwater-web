# Daily check that website leads can reach Odoo. A failing run makes
# GitHub email the repo owner. See app/api/health/leads/route.ts.
name: Lead pipeline health

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Odoo reachable with current API key
        run: curl --fail --silent --show-error --max-time 30 https://uniwater.co.in/api/health/leads
